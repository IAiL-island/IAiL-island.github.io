<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scrapper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .site-title{
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Search Results for {{keyword}}</h1>
        <form action ="/">
            <button>뒤로가기</button>
        </form>
        <figure>
            <table class="striped">
                <thead>
                    <tr>
                        <th>TITLE</th>
                        <th>COMPANY</th>
                        <th>LINK</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BERLIN STARTUP JOBS SECTION -->
                    <tr>
                        <th colspan="3" class="site-title">BERLIN STARTUP JOBS</th>
                    </tr>
                    {% for data in berlinjobs_datas %}
                    <tr>
                        <td>{{data.title}}</td>
                        <td>{{data.company}}</td>
                        <td><a href="{{data.link}}" target="_blank">Apply now &rarr;</a></td>
                    </tr>
                    {% endfor %}
                    <!-- WEB3 JOBS SECTION -->
                    <tr>
                        <th colspan="3" class="site-title">WEB3 JOBS</th>
                    </tr>
                    {% for data in web3_datas %}
                    <tr>
                        <td>{{data.title}}</td>
                        <td>{{data.company}}</td>
                        <td><a href="{{data.link}}" target="_blank">Apply now &rarr;</a></td>
                    </tr>
                    {% endfor %}
                    <!-- WE WORK REMOTELY SECTION -->
                    <tr>
                        <th colspan="3" class="site-title">WE WORK REMOTELY</th>
                    </tr>
                    {% for data in wework_datas %}
                    <tr>
                        <td>{{data.title}}</td>
                        <td>{{data.company}}</td>
                        <td><a href="{{data.link}}" target="_blank">Apply now &rarr;</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </figure>
    </main>
</body>
</html>
